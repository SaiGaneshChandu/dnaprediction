<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prediction Result</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #ff6b6b, #ff9a44, #ffd93d, #6bcB77, #4d96ff, #843bff);
            background-size: 400% 400%;
            animation: gradientMove 18s ease infinite;
            min-height: 100vh;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 620px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #333, #555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-card {
            background: #f8f9fa;
            padding: 28px 20px;
            border-radius: 16px;
            margin: 20px 0;
            border-left: 6px solid #28a745;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .error-box {
            border-left-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }

        .result-card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #333;
        }

        .result-text {
            font-size: 26px;
            font-weight: 700;
            margin: 15px 0;
            line-height: 1.3;
        }

        .success { color: #28a745; }
        .danger { color: #dc3545; }

        /* Back Button */
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 32px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            min-width: 200px;
        }

        .back-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .back-to-prediction {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .back-to-home {
            background: linear-gradient(135deg, #007bff, #28a745);
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 15px auto;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .result-text {
                font-size: 23px;
            }
            
            .back-btn {
                padding: 15px 28px;
                font-size: 16px;
                min-width: 180px;
            }
        }

        /* Extra touch friendly */
        .result-card {
            transition: transform 0.2s ease;
        }
        
        .result-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Prediction Result</h1>

        {% if error %}
            <div class="result-card error-box">
                <p style="font-size: 18px; font-weight: 500;">{{ error }}</p>
            </div>
        {% endif %}

        {% if ml_result %}
            <div class="result-card">
                <h2>DNA Sequence Analysis</h2>
                <p class="result-text success">
                    {{ ml_result }}
                </p>
            </div>
        {% endif %}

        {% if dl_result %}
            <div class="result-card">
                <h2>Image Classification</h2>
                <p class="result-text success">
                    {{ dl_result }}
                </p>
            </div>
        {% endif %}

        <!-- Back Button Logic -->
        {% if from_admin %}
            <a href="/admin-dashboard/?section=predict" class="back-btn back-to-prediction">
                ← Back to Prediction
            </a>
        {% else %}
            <a href="/home/" class="back-btn back-to-home">
                ← Back to Home
            </a>
        {% endif %}
    </div>

    <script>
        // Prevent zoom on double tap (extra safety)
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
